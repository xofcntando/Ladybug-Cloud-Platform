services:
  - type: web
    name: ladybug-cloud
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm --prefix bots/ladybug install --omit=dev --no-audit --no-fund
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # npm 11.6+/12 skips lifecycle scripts by default; the bot needs them
      # for sharp, canvas, ffmpeg-static and baileys.
      - key: NPM_CONFIG_DANGEROUSLY_ALLOW_ALL_SCRIPTS
        value: "true"
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      # Set both in the Render dashboard when the Blueprint is created.
      # Never deploy with a public default password.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Free MongoDB Atlas connection string - backs up users, bots, coins and
      # logins so they survive Render redeploys and sleep. Paste it in the dashboard.
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FREE_BOT_LIMIT
        value: "1"
      - key: PRO_BOT_LIMIT
        value: "10"
      # Free plan has no persistent disk, so data lives on the ephemeral
      # filesystem and resets on redeploy/sleep. To keep users + sessions
      # permanently, upgrade to plan: starter and uncomment the disk block
      # below, then set DATA_DIR=/var/data and BOT_DIR=/var/data/bots/ladybug.
      # Drive on the free plan is saved in MongoDB (MONGODB_URI) so files survive restarts.
      # Defaults: 350 MB total, 50 MB per user, 25 MB per file (a free Atlas cluster holds
      # 512 MB shared with everything else). Override with STORAGE_TOTAL_GB / STORAGE_USER_GB /
      # STORAGE_MAX_FILE_MB if you use a bigger cluster.
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: BOT_DIR
        value: /opt/render/project/src/bots/ladybug
    # disk:
    #   name: ladybug-data
    #   mountPath: /var/data
    #   sizeGB: 1

# Need 1 TB of file storage? Use render.storage.yaml instead (paid plan + disk).
